# Render Blueprint for Clauset
# Deploys the standalone Next.js Workbench with the in-process Embedded TypeScript Mesh Runtime.
services:
  - type: web
    name: clauset-workbench
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run next:start
    healthCheckPath: /api/protocol/health
    envVars:
      - key: PROTOCOL_FORCE_EMBEDDED
        value: "1"
      - key: NODE_VERSION
        value: "20.18.0"
